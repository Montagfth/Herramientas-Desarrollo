# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
spring.application.name=Farma
server.port=9080

# ===================================================================
# BASE DE DATOS (H2 en memoria para desarrollo)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:pharmacydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# ===================================================================
# JPA / HIBERNATE CONFIGURACIÓN
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ===================================================================
# JACKSON FECHAS
# ===================================================================
spring.jackson.time-zone=America/Lima
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.farmacy=INFO
logging.level.org.hibernate.SQL=INFO

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD (Spring Security / JWT)
# ===================================================================
jwt.secret=ClaveSecretaSuperSeguraParaFarmacia2026Minimo32Bytes!
jwt.expiration=86400000

# ===================================================================
# CONFIGURACIÓN CORS
# ===================================================================
spring.mvc.cors.paths=/
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true